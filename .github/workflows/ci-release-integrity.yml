name: CI — Release Integrity

on:
  push:
    branches: [main]
    paths:
      - 'installers/**'
      - 'Dockerfile.customer'
      - '.github/workflows/aim-data-release.yml'
      - 'docker-compose.aim-data.yml'
      - 'scripts/release-aim-data.sh'
      - '.github/workflows/ci-release-integrity.yml'

jobs:
  verify-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Need tags for version check

      - name: Check release version defaults match latest tag
        run: |
          # Get latest release tag
          LATEST_TAG=$(git tag -l 'aim-data-v*' --sort=-v:refname | grep -E '^aim-data-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No release tags found — skipping version check"
            exit 0
          fi
          
          echo "Latest tag: $LATEST_TAG"
          
          # Compose and both standalone installers must reference this tag.
          VERSION="${LATEST_TAG#aim-data-}"
          ERRORS=0

          COMPOSE_EXPECTED=$(grep -oF "AIM_DATA_VERSION:-${VERSION}" docker-compose.aim-data.yml | wc -l | tr -d ' ' || true)
          COMPOSE_DEFAULTS=$(grep -o 'AIM_DATA_VERSION:-v[0-9][^}]*' docker-compose.aim-data.yml | wc -l | tr -d ' ' || true)
          if [ "$COMPOSE_EXPECTED" -eq 1 ] && [ "$COMPOSE_DEFAULTS" -eq 1 ]; then
            echo "✅ Compose file has exactly one default referencing ${LATEST_TAG}"
          else
            COMPOSE_VERSIONS=$(grep -o 'AIM_DATA_VERSION:-v[0-9][^}]*' docker-compose.aim-data.yml | tr '\n' ' ' || true)
            echo "::error::INTEGRITY FAILED — Compose file must have exactly one ${VERSION} default; found ${COMPOSE_DEFAULTS}: ${COMPOSE_VERSIONS:-unparseable}."
            ERRORS=$((ERRORS + 1))
          fi

          SHELL_EXPECTED=$(grep -oF "AIM_DATA_VERSION:-${VERSION}" installers/aim-data/install.sh | wc -l | tr -d ' ' || true)
          SHELL_DEFAULTS=$(grep -o 'AIM_DATA_VERSION:-v[0-9][^}]*' installers/aim-data/install.sh | wc -l | tr -d ' ' || true)
          if [ "$SHELL_EXPECTED" -eq 1 ] && [ "$SHELL_DEFAULTS" -eq 1 ]; then
            echo "✅ Shell installer has exactly one default referencing ${LATEST_TAG}"
          else
            SHELL_VERSIONS=$(grep -o 'AIM_DATA_VERSION:-v[0-9][^}]*' installers/aim-data/install.sh | tr '\n' ' ' || true)
            echo "::error::INTEGRITY FAILED — Shell installer must have exactly one ${VERSION} default; found ${SHELL_DEFAULTS}: ${SHELL_VERSIONS:-unparseable}."
            ERRORS=$((ERRORS + 1))
          fi

          POWERSHELL_EXPECTED=$(grep -oF "else { '${VERSION}' }" installers/aim-data/install.ps1 | wc -l | tr -d ' ' || true)
          POWERSHELL_DEFAULTS=$(grep -o "else { 'v[0-9][^']*' }" installers/aim-data/install.ps1 | wc -l | tr -d ' ' || true)
          if [ "$POWERSHELL_EXPECTED" -eq 1 ] && [ "$POWERSHELL_DEFAULTS" -eq 1 ]; then
            echo "✅ PowerShell installer has exactly one default referencing ${LATEST_TAG}"
          else
            POWERSHELL_VERSIONS=$(grep -o "else { 'v[0-9][^']*' }" installers/aim-data/install.ps1 | tr '\n' ' ' || true)
            echo "::error::INTEGRITY FAILED — PowerShell installer must have exactly one ${VERSION} default; found ${POWERSHELL_DEFAULTS}: ${POWERSHELL_VERSIONS:-unparseable}."
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi

      - name: Verify multi-arch build configuration
        run: |
          echo "Checking aim-data-release.yml builds for both amd64 and arm64..."

          PLATFORMS_LINE=$(grep 'platforms:' .github/workflows/aim-data-release.yml || echo "")

          if [ -z "$PLATFORMS_LINE" ]; then
            echo "::error::INTEGRITY FAILED — aim-data-release.yml has no platforms: directive. Images must build for linux/amd64,linux/arm64."
            exit 1
          fi

          if ! echo "$PLATFORMS_LINE" | grep -q "linux/amd64"; then
            echo "::error::INTEGRITY FAILED — aim-data-release.yml missing linux/amd64 platform."
            exit 1
          fi
          echo "✅ linux/amd64 configured"

          if ! echo "$PLATFORMS_LINE" | grep -q "linux/arm64"; then
            echo "::error::INTEGRITY FAILED — aim-data-release.yml missing linux/arm64 platform. Apple Silicon Macs will fail to install."
            exit 1
          fi
          echo "✅ linux/arm64 configured"

          # Verify QEMU is set up (required for cross-platform builds on GH Actions)
          if ! grep -q "setup-qemu-action" .github/workflows/aim-data-release.yml; then
            echo "::error::INTEGRITY FAILED — aim-data-release.yml missing docker/setup-qemu-action. Cross-arch builds will fail."
            exit 1
          fi
          echo "✅ QEMU setup action present"

          echo "✅ Multi-arch build configuration verified"

      - name: Shell script syntax check
        run: |
          ERRORS=0
          for script in installers/aim-data/install.sh scripts/release-aim-data.sh; do
            if [ -f "$script" ]; then
              if bash -n "$script" 2>&1; then
                echo "✅ $script"
              else
                echo "::error::Syntax error in $script"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi

      - name: Verify v-prefix convention
        run: |
          # Compose file must use v-prefixed version
          VERSION_REF=$(grep -o 'AIM_DATA_VERSION:-[^}]*' docker-compose.aim-data.yml | head -1)
          if echo "$VERSION_REF" | grep -qE 'AIM_DATA_VERSION:-v[0-9]'; then
            echo "✅ Compose uses v-prefixed version: $VERSION_REF"
          elif echo "$VERSION_REF" | grep -qE 'AIM_DATA_VERSION:-[0-9]'; then
            echo "::error::Compose uses non-v-prefixed version: $VERSION_REF — GHCR tags require v prefix"
            exit 1
          else
            echo "⚠ Could not parse version from compose file: $VERSION_REF"
          fi
